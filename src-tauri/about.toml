# cargo-about: Lizenzen der Rust-Abhängigkeiten für THIRD-PARTY-NOTICES.txt.
# Aufruf über `bun run notices` (scripts/notices.mjs), nicht direkt.

# Reihenfolge = Vorzug bei "A OR B": MIT vor Apache-2.0 usw.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "Unlicense",
]

# Nur was in der Windows-Exe landet.
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
