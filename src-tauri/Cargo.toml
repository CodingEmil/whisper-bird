[package]
name = "whisper-island"
version = "0.2.0"
description = "Whisper Bird – lokales Diktieren, Verbessern und Transkribieren für Windows und macOS"
authors = ["Emil"]
edition = "2021"
default-run = "whisper-island"
publish = false

[lib]
name = "whisper_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: transparente Fenster unter macOS (unter Windows ohne Wirkung).
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "fs", "io-util"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
semver = "1"
strsim = "0.11"
hound = "3.5"
symphonia = { version = "0.5", features = ["all"] }

# Audio-Aufnahme, Hotkeys und Transkription aus dem Handy-Ökosystem (MIT)
handy-recorder = "0.1"
handy-keys = "0.3.4"
aec3 = "0.4"

# Spracherkennung auf der GPU: Vulkan unter Windows (siehe unten), Metal auf
# Apple Silicon. Intel-Macs laufen auf der CPU (wie bei Handy).
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies.transcribe-cpp]
version = "0.4.1"
default-features = false
features = ["metal"]

[target.'cfg(not(any(windows, all(target_os = "macos", target_arch = "aarch64"))))'.dependencies.transcribe-cpp]
version = "0.4.1"
default-features = false

[target.'cfg(windows)'.dependencies]
transcribe-cpp = { version = "0.4.1", default-features = false, features = ["vulkan"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Media_KernelStreaming",
  "Win32_Media_Multimedia",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Overlay und Kontextmenü als NSPanel: schweben über allen Apps, ohne sie zu deaktivieren.
tauri-nspanel = "2.1"
# System-Audio über einen Core-Audio-Process-Tap (ab macOS 14.6); dieselbe
# cpal-Variante, die handy-recorder schon mitbringt.
cpal = { package = "handy-cpal", version = "0.18" }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
block2 = "0.6"

[profile.dev]
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
