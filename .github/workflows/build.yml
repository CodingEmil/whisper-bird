# Baut die Windows-Exe (Installer + portable Zip) und die Mac-App (.dmg, Apple Silicon).
# - Manuell: Actions → Build → "Run workflow" (oder `gh workflow run build.yml`)
#   → Ergebnis als Artifacts am Workflow-Lauf. Mit „release“ zusätzlich ein GitHub Release
#   samt Tag `v<Version aus tauri.conf.json>` auf dem gebauten Commit (wie beim Tag-Push).
# - Tag `vX.Y.Z` pushen → zusätzlich GitHub Release mit allen Dateien, sobald beide
#   Builds grün sind. `vX.Y.Z-beta.N` wird als Vorabversion veröffentlicht.
name: Build

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release mit Tag v<Version> anlegen"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Portable CPU-Basis statt der CPU des Build-Runners: ggml würde sonst
      # z. B. AVX-512 nutzen und auf vielen Desktop-CPUs sofort abstürzen.
      # AVX2 haben alle Intel-CPUs seit 2013 und alle Ryzen.
      TRANSCRIBE_CMAKE_ARGS: -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON

    steps:
      - name: Lange Pfade erlauben
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force | Out-Null
          git config --system core.longpaths true

      - uses: actions/checkout@v5
        with:
          # Ganze Historie samt Tags: Die Release-Notizen sammeln die Commits seit dem letzten Tag.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-bin: false

      - name: Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # ggml-vulkan sucht SPIRV-Headers per find_package; das SDK auf dem Runner
      # liefert keine passende CMake-Config (gleiches Vorgehen wie Handy).
      - name: SPIRV-Headers
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers fehlgeschlagen" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          $combined = if ($env:CMAKE_PREFIX_PATH) { "$prefix;$env:CMAKE_PREFIX_PATH" } else { $prefix }
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$combined"

      # Die Exe braucht MSVCP140/VCRUNTIME140. Die DLLs werden neben die Exe
      # gelegt (app-local), damit sie auch ohne installiertes VC++-Redist startet.
      - name: Version und Bundle-Konfiguration
        id: cfg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -property installationPath
          $redistVersion = (Get-Content "$vsRoot\VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt").Trim()
          $crt = Get-ChildItem "$vsRoot\VC\Redist\MSVC\$redistVersion\x64" -Directory -Filter "Microsoft.VC*.CRT" |
            Sort-Object Name | Select-Object -Last 1
          if (-not $crt) { throw "VC++-Runtime nicht gefunden" }
          New-Item -ItemType Directory -Force src-tauri\redist | Out-Null
          Copy-Item "$($crt.FullName)\*.dll" src-tauri\redist\
          $resources = [ordered]@{}
          Get-ChildItem src-tauri\redist\*.dll | ForEach-Object { $resources["redist/$($_.Name)"] = $_.Name }

          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = (Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          }
          @{ version = $version; bundle = @{ resources = $resources } } |
            ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 src-tauri\ci.conf.json
          Get-Content src-tauri\ci.conf.json
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Frontend-Abhängigkeiten
        run: bun install --frozen-lockfile

      # Schnelle Tests vor dem Build: Ist einer rot, entstehen weder Installer noch Release.
      # Die End-to-End-Tests mit echten Modellen (scripts/test.ps1) laufen nur lokal.
      - name: TypeScript
        run: bun x tsc --noEmit

      - name: UI-Tests
        shell: pwsh
        run: |
          bun x playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw "Playwright-Browser ließ sich nicht installieren" }
          bun run test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ui-test-results
          path: test-results/
          if-no-files-found: ignore

      # --release: dieselben Abhängigkeiten wie der Build danach, transcribe.cpp
      # wird also nur einmal kompiliert.
      - name: Rust-Unit-Tests
        working-directory: src-tauri
        run: cargo test --release --lib

      - name: Build
        shell: pwsh
        run: bun run tauri build --config "$env:GITHUB_WORKSPACE\src-tauri\ci.conf.json"

      - name: Dateien zusammenstellen
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ steps.cfg.outputs.version }}"
          New-Item -ItemType Directory out, portable | Out-Null
          Copy-Item src-tauri\target\release\bundle\nsis\*.exe out\
          Copy-Item src-tauri\target\release\whisper-island.exe "portable\Whisper Bird.exe"
          Copy-Item src-tauri\redist\*.dll portable\
          Copy-Item THIRD-PARTY-NOTICES.txt portable\
          Compress-Archive portable\* "out\Whisper-Bird_${version}_x64-portable.zip"
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: whisper-bird-${{ steps.cfg.outputs.version }}
          path: out/*

  # Mac-App für Apple Silicon. Nicht notarisiert (ad hoc signiert): Beim ersten Start
  # muss man sie einmal freigeben, siehe docs/macos.md.
  macos:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-bin: false

      # Wie unter Windows: Bei einem Tag gilt dessen Versionsnummer.
      - name: Version
        id: cfg
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(jq -r .version src-tauri/tauri.conf.json)
          fi
          jq -n --arg v "$version" '{version: $v}' > src-tauri/ci.conf.json
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Frontend-Abhängigkeiten
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun x tsc --noEmit

      # Die UI-Tests laufen schon im Windows-Job; hier zählen die Mac-Pfade im Rust-Code.
      - name: Rust-Unit-Tests
        working-directory: src-tauri
        run: cargo test --release --lib

      - name: Build
        run: bun run tauri build --bundles app,dmg --config src-tauri/ci.conf.json

      - name: Dateien zusammenstellen
        run: |
          mkdir out
          cp src-tauri/target/release/bundle/dmg/*.dmg out/
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: whisper-bird-${{ steps.cfg.outputs.version }}-macos
          path: out/*

  # Erst wenn Windows und Mac gebaut sind: ein Release mit allen Dateien.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          # Beim Tag-Push dessen Name, beim manuellen Start die Version aus tauri.conf.json.
          # Den Tag legt dann `gh release create` auf dem gebauten Commit an.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(jq -r .version src-tauri/tauri.conf.json)"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::Tag $tag gibt es schon, erst die Version erhöhen"
              exit 1
            fi
          fi
          prerelease=()
          [[ "$tag" == *-* ]] && prerelease=(--prerelease)
          # Die Stichpunkte über der Linie zeigt die App nach dem Update als Neuerungen an
          # (updates::release_notes); auf GitHub lassen sie sich nachträglich bearbeiten.
          prev=$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)
          {
            echo "## Neu"
            echo
            git log --no-merges --max-count=30 --pretty='- %s' "${prev:+$prev..}$GITHUB_SHA"
            echo
            echo "---"
            echo
            echo "**Windows:** Installer (\`*-setup.exe\`) oder portable Zip. Nicht signiert: Windows SmartScreen zeigt beim ersten Start „Unbekannter Herausgeber“ → Weitere Informationen → Trotzdem ausführen."
            echo
            echo "**macOS** (Apple Silicon, ab macOS 12): \`*_aarch64.dmg\`. Nicht notarisiert: Beim ersten Start einmal unter Systemeinstellungen → Datenschutz & Sicherheit → Trotzdem öffnen freigeben. Schritt für Schritt: [Installation auf dem Mac](https://github.com/$GITHUB_REPOSITORY/blob/$tag/docs/macos.md)."
            if [[ -n "$prev" ]]; then
              echo
              echo "**Alle Änderungen**: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$tag"
            fi
          } > release-notes.md
          cat release-notes.md
          gh release create "$tag" out/* "${prerelease[@]}" \
            --target "$GITHUB_SHA" \
            --title "Whisper Bird ${tag#v}" \
            --notes-file release-notes.md
